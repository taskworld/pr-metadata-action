name: PR Metadata
description: Extract JSON metadata from an HTML comment in a pull request body
branding:
  icon: tag
  color: blue

inputs:
  github-token:
    description: Token used when the REST API fallback is needed
    default: ${{ github.token }}
    required: false
  marker:
    description: Marker name inside the HTML comment
    default: pr-meta
    required: false
  pr-number:
    description: PR number to read. Defaults to the PR from the triggering event
    required: false

outputs:
  has-metadata:
    description: true when the marker was found in the PR body, false otherwise
    value: ${{ steps.read.outputs.has-metadata }}
  result:
    description: Parsed JSON or an empty string if the action fails
    value: ${{ steps.read.outputs.result }}

runs:
  using: composite
  steps:
    - id: read
      uses: actions/github-script@v9
      env:
        INPUT_MARKER: ${{ inputs.marker }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          async function fetchPrBody(prNumber) {
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })

            return data.body
          }

          const prNumber = Number(core.getInput('pr-number'))
          const marker = core.getInput('marker') || 'pr-meta'

          const body = prNumber === 0
            ? context.payload.pull_request.body
            : await fetchPrBody(prNumber)

          core.setOutput('has-metadata', 'false')
          const escaped = marker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          const re = new RegExp(`<!--\\s*${escaped}:\\s*([\\s\\S]*?)\\s*-->`)
          const match = body?.match(re)

          if (!match) {
            core.setFailed(`Marker "${marker}" not found in PR body.`)
            return ''
          }

          core.setOutput('has-metadata', 'true')

          try {
            return JSON.parse(match[1])
          } catch (err) {
            core.setFailed(`Failed to parse JSON for marker "${marker}": ${err.message}`)
            return ''
          }
