name: tests-read

on:
  pull_request:

# read only needs to read; the seed step uses write, which needs write.
permissions:
  pull-requests: write
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Seed a known blob under a dedicated marker so the read is deterministic.
      - id: seed
        uses: ./write
        with:
          marker: test-read
          data: '{"version":"4.5.6","reviewed":true}'

      # Read from the triggering PR (default pr-number).
      - id: read
        uses: ./read
        with:
          marker: test-read

      # Read the same PR via an explicit pr-number (REST fallback path).
      - id: read-explicit
        uses: ./read
        with:
          marker: test-read
          pr-number: ${{ github.event.pull_request.number }}

      - name: Assert reads
        env:
          RESULT: ${{ steps.read.outputs.result }}
          HAS_METADATA: ${{ steps.read.outputs.has-metadata }}
          RESULT_EXPLICIT: ${{ steps.read-explicit.outputs.result }}
          HAS_METADATA_EXPLICIT: ${{ steps.read-explicit.outputs.has-metadata }}
        run: |
          echo "default:  has-metadata=$HAS_METADATA result=$RESULT"
          echo "explicit: has-metadata=$HAS_METADATA_EXPLICIT result=$RESULT_EXPLICIT"

          [ "$HAS_METADATA" = "true" ]          || { echo "::error::default read missed the marker"; exit 1; }
          [ "$HAS_METADATA_EXPLICIT" = "true" ] || { echo "::error::explicit read missed the marker"; exit 1; }

          [ "$(echo "$RESULT" | jq -r '.version')"           = "4.5.6" ] || { echo "::error::default read wrong version"; exit 1; }
          [ "$(echo "$RESULT_EXPLICIT" | jq -r '.version')"  = "4.5.6" ] || { echo "::error::explicit read wrong version"; exit 1; }
          [ "$(echo "$RESULT" | jq -r '.reviewed')"          = "true" ]  || { echo "::error::default read wrong reviewed"; exit 1; }

          echo "read self-test passed"
